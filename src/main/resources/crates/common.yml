# ========================================
#             Common Crate
# ========================================
#
# This is an example crate. Every prize below uses vanilla commands only,
# so it works on a fresh server - replace them with your own.
#
# Prize fields:
#   name      - fallback display name (item.name overrides it)
#   commands  - run as console when won, %player% is replaced
#   chance    - relative weight, higher = more common
#   item      - how the prize looks in /crate preview
#   announce  - broadcast the win to the server

# Display settings
display-name: "&7Common Crate"
crate:
  material: "CHEST"
  custom-model-data: "vulcan:crate_common"

key-item:
  material: "TRIPWIRE_HOOK"
  name: "&7&lCommon Key"
  lore:
    - "&7Use this key to open"
    - "%crate_display%&7."
  glowing: true

# Hologram settings
hologram:
  lines:
    - "&f>&7>&f> &7&lCommon Crate &f<&7<&f<"
    - "&7Right-click to open, left-click to preview"
    - "&7You have &f%vulcancrates_keys_common% &7keys"
  y-offset: 2.0

# Effects played when the crate is opened
# Sound names: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
# Particle names: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Particle.html
effects:
  open:
    sound: "ENTITY_PLAYER_LEVELUP"
    sound-volume: 1.0
    sound-pitch: 1.0
    particle: "FIREWORKS_SPARK"
    particle-count: 30
    particle-speed: 0.2
    particle-offset-x: 0.5
    particle-offset-y: 0.5
    particle-offset-z: 0.5

# Prizes configuration
prizes:
  diamonds:
    name: "&b&l8x Diamond"
    commands:
      - "give %player% diamond 8"
    chance: 45
    item:
      type: "DIAMOND"
      amount: 8
      damage: 0
      name: "&b&l8x Diamond"
      lore: []
      glowing: true
    announce: false

  gold-ingots:
    name: "&6&l16x Gold Ingot"
    commands:
      - "give %player% gold_ingot 16"
    chance: 45
    item:
      type: "GOLD_INGOT"
      amount: 16
      damage: 0
      name: "&6&l16x Gold Ingot"
      lore: []
      glowing: false
    announce: false

  iron-blocks:
    name: "&f&l8x Iron Block"
    commands:
      - "give %player% iron_block 8"
    chance: 40
    item:
      type: "IRON_BLOCK"
      amount: 8
      damage: 0
      name: "&f&l8x Iron Block"
      lore: []
      glowing: false
    announce: false

  golden-apples:
    name: "&e&l8x Golden Apple"
    commands:
      - "give %player% golden_apple 8"
    chance: 35
    item:
      type: "GOLDEN_APPLE"
      amount: 8
      damage: 0
      name: "&e&l8x Golden Apple"
      lore:
        - "&7A handful of golden apples."
      glowing: true
    announce: false

  ender-pearls:
    name: "&5&l16x Ender Pearl"
    commands:
      - "give %player% ender_pearl 16"
    chance: 35
    item:
      type: "ENDER_PEARL"
      amount: 16
      damage: 0
      name: "&5&l16x Ender Pearl"
      lore: []
      glowing: false
    announce: false

  tnt:
    name: "&c&l32x TNT"
    commands:
      - "give %player% tnt 32"
    chance: 30
    item:
      type: "TNT"
      amount: 32
      damage: 0
      name: "&c&l32x TNT"
      lore: []
      glowing: false
    announce: false

  obsidian:
    name: "&5&l32x Obsidian"
    commands:
      - "give %player% obsidian 32"
    chance: 30
    item:
      type: "OBSIDIAN"
      amount: 32
      damage: 0
      name: "&5&l32x Obsidian"
      lore: []
      glowing: false
    announce: false

  # A prize can run several commands - use this for economy, kits or
  # permission plugins, e.g. "eco give %player% 5000"
  supply-drop:
    name: "&a&lSupply Drop"
    commands:
      - "give %player% cooked_beef 64"
      - "give %player% arrow 64"
      - "give %player% bow 1"
    chance: 25
    item:
      type: "CHEST"
      amount: 1
      damage: 0
      name: "&a&lSupply Drop"
      lore:
        - ""
        - "&8» &f64x Cooked Beef"
        - "&8» &f64x Arrow"
        - "&8» &f1x Bow"
      glowing: true
    announce: false

  # Crate keys can be prizes too - this uses the plugin's own command
  common-keys:
    name: "&7&l3x Common Key"
    commands:
      - "crate give %player% common 3"
    chance: 20
    item:
      type: "TRIPWIRE_HOOK"
      amount: 3
      damage: 0
      name: "&7&l3x Common Key"
      lore: []
      glowing: true
    announce: false

  # Custom player-head textures are supported through 'url'
  diamond-cache:
    name: "&b&lDiamond Cache"
    commands:
      - "give %player% diamond_block 4"
    chance: 10
    item:
      type: "SKULL_ITEM"
      amount: 1
      damage: 3
      name: "&b&lDiamond Cache"
      lore:
        - ""
        - "&8» &f4x Diamond Block"
      url: "http://textures.minecraft.net/texture/35f55536bc7e023ae7069ed7c445b4d59fc8c2c49a7e8eaa59231282e9fbf4d1"
      glowing: true
    announce: true
