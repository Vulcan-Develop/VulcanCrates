# ================================
#        Legendary Crate
# ================================
#
# A second example crate, showing a rarer prize pool with broadcasts.
# Every prize uses vanilla commands only - replace them with your own.

# Display settings
display-name: "&6Legendary Crate"
crate:
  material: "CHEST"
  custom-model-data: "vulcan:crate_legendary"

key-item:
  material: "TRIPWIRE_HOOK"
  name: "&6&lLegendary Key"
  lore:
    - "&7Use this key to open"
    - "%crate_display%&7."
  glowing: true

# Hologram settings
hologram:
  lines:
    - "&e>&6>&e> &6&lLEGENDARY CRATE &e<&6<&e<"
    - "&7Right-click to open, left-click to preview"
    - "&7You have &f%vulcancrates_keys_legendary% &7keys"
  y-offset: 2.0

# Effects played when the crate is opened
# Sound names: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
# Particle names: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Particle.html
effects:
  open:
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    sound-volume: 1.0
    sound-pitch: 1.0
    particle: "TOTEM"
    particle-count: 50
    particle-speed: 0.3
    particle-offset-x: 0.5
    particle-offset-y: 0.5
    particle-offset-z: 0.5

# Prizes configuration
prizes:
  diamond-blocks:
    name: "&b&l16x Diamond Block"
    commands:
      - "give %player% diamond_block 16"
    chance: 40
    item:
      type: "DIAMOND_BLOCK"
      amount: 16
      damage: 0
      name: "&b&l16x Diamond Block"
      lore: []
      glowing: true
    announce: true

  emerald-blocks:
    name: "&a&l16x Emerald Block"
    commands:
      - "give %player% emerald_block 16"
    chance: 40
    item:
      type: "EMERALD_BLOCK"
      amount: 16
      damage: 0
      name: "&a&l16x Emerald Block"
      lore: []
      glowing: true
    announce: true

  gold-blocks:
    name: "&6&l32x Gold Block"
    commands:
      - "give %player% gold_block 32"
    chance: 35
    item:
      type: "GOLD_BLOCK"
      amount: 32
      damage: 0
      name: "&6&l32x Gold Block"
      lore: []
      glowing: false
    announce: false

  diamond-gear:
    name: "&b&lDiamond Gear"
    commands:
      - "give %player% diamond_helmet 1"
      - "give %player% diamond_chestplate 1"
      - "give %player% diamond_leggings 1"
      - "give %player% diamond_boots 1"
      - "give %player% diamond_sword 1"
    chance: 30
    item:
      type: "DIAMOND_CHESTPLATE"
      amount: 1
      damage: 0
      name: "&b&lDiamond Gear"
      lore:
        - ""
        - "&8» &fFull diamond armour"
        - "&8» &f1x Diamond Sword"
      glowing: true
    announce: true

  legendary-keys:
    name: "&6&l2x Legendary Key"
    commands:
      - "crate give %player% legendary 2"
    chance: 20
    item:
      type: "TRIPWIRE_HOOK"
      amount: 2
      damage: 0
      name: "&6&l2x Legendary Key"
      lore: []
      glowing: true
    announce: false

  beacon:
    name: "&b&lBeacon"
    commands:
      - "give %player% beacon 1"
    chance: 15
    item:
      type: "BEACON"
      amount: 1
      damage: 0
      name: "&b&lBeacon"
      lore:
        - ""
        - "&7One of the rarest drops in this crate."
      glowing: true
    announce: true

  nether-star:
    name: "&f&lNether Star"
    commands:
      - "give %player% nether_star 1"
    chance: 8
    item:
      type: "NETHER_STAR"
      amount: 1
      damage: 0
      name: "&f&lNether Star"
      lore: []
      glowing: true
    announce: true

  dragon-egg:
    name: "&5&lDragon Egg"
    commands:
      - "give %player% dragon_egg 1"
    chance: 4
    item:
      type: "DRAGON_EGG"
      amount: 1
      damage: 0
      name: "&5&lDragon Egg"
      lore:
        - ""
        - "&7The rarest prize in the crate."
      glowing: true
    announce: true
