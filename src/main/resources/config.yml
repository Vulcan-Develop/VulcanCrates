config-version: 8 # Do not touch this

# ================================
#        Crates Configuration
# ================================

# Command settings
commands:
  aliases:
    - "crate"

# Key settings
keys:
  mode: "BOTH" # VIRTUAL, PHYSICAL, or BOTH
  default-give-mode: "VIRTUAL" # Used by /crate give and /crate giveall
  consume-priority: "PHYSICAL" # Used when mode is BOTH

# Spin settings
# Players choose active winning rows before starting the countdown.
spin:
  enabled: true # false = keys award a random prize instantly, with no menu
  max-rows: 6 # Maximum active rows per opening, also capped by the selectable rows in gui.yml
  keys-per-window: 6 # Maximum keys and reward rows used by one spin window; each selected row costs one key

# Crate block settings
crate-block:
  auto-restore-on-startup: true
  auto-place-on-set: true
  replaceable-blocks:
    - "AIR"
    - "GRASS"
    - "TALL_GRASS"
    - "WATER"
    - "LAVA"

holograms:
  display-range: 16
  update-range: 16
  update-interval: 20

# Messages
messages:
  prefix: "&6[Crates]"
  gave-keys: "%prefix% &7You gave %player% &6%givenAmount% &7%crateType% %keyType% key(s)!"
  received-keys: "%prefix% &7You received &6%givenAmount% &7%crateType% %keyType% key(s)!"
  crate-rolled-reward-announce: "%prefix% &r%player% &7just rolled a &6%prizeName% &7from a %crateType%&7!"
  crate-rolled-reward: "%prefix% &7You won &6%prizeName%&7!"
  crate-block-placed: "%prefix% &7%crateType% crate successfully placed at your location."
  crate-removed: "%prefix% &7%crateType% crate location removed and chest destroyed."
  no-keys: "%prefix% &7You need a %crateType% %keyType% key to open this crate."
  not-enough-keys: "%prefix% &7You need &6%required% &7%crateType% %keyType% key(s), but only have &6%available%&7."
  no-prizes: "%prefix% &cThis crate has no prizes configured."
  already-opening: "%prefix% &7Finish the crate you already have open first."
  spin-select-required: "%prefix% &7Select at least one row first."
  spin-row-limit: "%prefix% &7You can select up to &6%limit% &7row(s)."
  spin-select-prompt: "%prefix% &7Pick &6one &7reward from each highlighted row. &8(%spins% active row(s))"
  physical-keys-dropped: "%prefix% &7Your inventory was full, so &6%amount% &7%crateType% physical key(s) were dropped at your feet."
  admin-test-prize: "&a[ADMIN TEST] &7You received the prize: &6%prizeName%"
